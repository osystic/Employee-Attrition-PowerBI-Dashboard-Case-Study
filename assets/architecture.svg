<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" rx="28" fill="#0b1220"/>
  <style>
    .box{fill:#111c31;stroke:#4fd1c5;stroke-width:2}
    .t{font-family:Arial,sans-serif;fill:#f7fafc;font-size:24px;font-weight:700}
    .s{font-family:Arial,sans-serif;fill:#cbd5e1;font-size:17px}
    .a{stroke:#7dd3fc;stroke-width:3;fill:none;marker-end:url(#m)}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker></defs>
  <text x="60" y="55" class="t">Employee Attrition Analytics - Power BI Architecture</text>
  <rect x="60" y="105" width="250" height="120" rx="18" class="box"/>
  <text x="90" y="150" class="t">Source Data</text>
  <text x="90" y="185" class="s">General + employee survey</text>
  <text x="90" y="210" class="s">+ manager survey</text>
  <rect x="380" y="105" width="250" height="120" rx="18" class="box"/>
  <text x="410" y="150" class="t">Power Query</text>
  <text x="410" y="185" class="s">Audit, merge, labels, bands</text>
  <text x="410" y="210" class="s">One employee grain</text>
  <rect x="700" y="105" width="220" height="120" rx="18" class="box"/>
  <text x="735" y="150" class="t">DAX Layer</text>
  <text x="735" y="185" class="s">Rate, benchmark, risk</text>
  <text x="735" y="210" class="s">Filter-responsive KPIs</text>
  <rect x="970" y="105" width="170" height="120" rx="18" class="box"/>
  <text x="995" y="150" class="t">Report</text>
  <text x="995" y="185" class="s">Overview</text>
  <text x="995" y="210" class="s">Drivers + UX</text>
  <path d="M310 165 H370" class="a"/>
  <path d="M630 165 H690" class="a"/>
  <path d="M920 165 H960" class="a"/>
  <rect x="180" y="330" width="840" height="145" rx="20" class="box"/>
  <text x="220" y="375" class="t">Analytical Story</text>
  <text x="220" y="410" class="s">Lifecycle concentration - Age + company tenure</text>
  <text x="220" y="440" class="s">Employee experience - Work-life balance + satisfaction + manager tenure</text>
  <text x="220" y="470" class="s">Governance - Sample-size context + descriptive, non-causal interpretation</text>
  <path d="M810 225 V315" class="a"/>
</svg>
